<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnosi serie</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: #F7F3EC; color: #1f2a2b; }
  @media (prefers-color-scheme: dark) { body { background: #151b1c; color: #eee; } input { background: #222; color: #eee; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 6px 0 12px; }
  button { min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid #999; background: #2F5457; color: #fff; font-size: 15px; margin: 4px 6px 4px 0; }
  button.alt { background: transparent; color: inherit; }
  input { min-height: 40px; width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px 10px; border-radius: 8px; border: 1px solid #999; font-size: 15px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace; background: rgba(127,127,127,.12); padding: 10px; border-radius: 10px; }
  iframe { width: 1px; height: 1px; border: 0; position: absolute; left: -10px; }
</style>
</head>
<body>
<h1>Diagnosi della ricerca delle serie</h1>
<p>Prova la ricerca su alcuni libri di serie note e mostra cosa risponde ogni fonte. Non modifica i tuoi libri. Alla fine tocca «Copia il risultato» e incollalo a Claude.</p>
<button id="go" disabled>Avvio…</button>
<button id="var">Confronta le interrogazioni</button>
<button id="copy" class="alt">Copia il risultato</button>
<details><summary>Prova un altro libro</summary>
  <input id="t" placeholder="Titolo"><input id="a" placeholder="Autore"><input id="i" placeholder="ISBN (facoltativo)">
  <button id="one" class="alt">Prova questo libro</button>
</details>
<pre id="out"></pre>
<iframe id="app" src="index.html"></iframe>
<script>
(function () {
  const out = document.getElementById("out"), go = document.getElementById("go");
  const log = s => { out.textContent += s + "\n"; };
  const BOOKS = [
    { title: "Un covo di bastardi", author: "Mick Herron" },
    { title: "Leoni morti", author: "Mick Herron" },
    { title: "La forma dell'acqua", author: "Andrea Camilleri" },
    { title: "Uomini che odiano le donne", author: "Stieg Larsson" },
    { title: "Harry Potter e la pietra filosofale", author: "J.K. Rowling" },
    { title: "Il trono di spade", author: "George R.R. Martin" }
  ];
  const kind = u => /query\.wikidata/.test(u) ? (/P212/.test(u) ? "Wikidata ISBN" : /P50/.test(u) ? "Wikidata opere dell'autore" : "Wikidata") : /wbsearchentities/.test(u) ? "Wikidata cerca autore" : /openlibrary/.test(u) ? "Open Library" : /googleapis/.test(u) ? "Google" : u.slice(0, 60);
  let S = null, cur = "";
  const frame = document.getElementById("app");
  frame.onload = () => {
    const w = frame.contentWindow, real = w.fetch.bind(w);
    w.fetch = async (url, opts) => {
      const u = String(url), t0 = Date.now(), k = kind(decodeURIComponent(u));
      try {
        const r = await real(url, opts), ms = Date.now() - t0;
        let info = "";
        try {
          const j = await r.clone().json();
          if (j.results && j.results.bindings) {
            const b = j.results.bindings;
            const key = cur.toLowerCase().replace(/^((il|lo|la|i|gli|le|un|uno|una)\s+|l'|un')/, "").slice(0, 6);
            const sim = b.filter(x => x.names && x.names.value.toLowerCase().includes(key));
            info = b.length + " righe" + (sim.length ? `; simili a «${key}»: ` + sim.slice(0, 3).map(x => [x.s, x.n, x.names].map(v => v && v.value ? String(v.value).slice(0, 80) : "").filter(Boolean).join(" / ")).join(" | ") : `; nessuna simile a «${key}»`) + (b.length ? " — prime: " + b.slice(0, 2).map(x => [x.s, x.n, x.names].map(v => v && v.value ? String(v.value).slice(0, 60) : "").filter(Boolean).join(" / ")).join(" | ") : "");
          } else if (j.search) info = j.search.length + " candidati: " + j.search.slice(0, 3).map(x => x.id + " " + (x.label || "") + (x.description ? " (" + x.description.slice(0, 30) + ")" : "")).join("; ");
          else if (j.title) info = "titolo: " + j.title;
          else if (j.items) info = j.items.length + " risultati";
        } catch { info = "(risposta non JSON)"; }
        log(`   · ${k}: ${r.status} in ${ms} ms — ${info}`);
        return r;
      } catch (e) { log(`   · ${k}: ERRORE ${e && e.name || e} dopo ${Date.now() - t0} ms`); throw e; }
    };
    const wait = () => { S = w.libreriaSeries; if (S && S.findSeries) { go.disabled = false; go.textContent = "Avvia la diagnosi"; } else setTimeout(wait, 300); };
    wait();
  };
  async function test(b) {
    cur = b.title; log(`\n▶ ${b.title} — ${b.author}${b.isbn ? " — ISBN " + b.isbn : ""}`);
    try {
      const r = await S.findSeries(b, new Map());
      log(r ? `  = serie «${r.series || "?"}» n. ${r.no || "?"}${r.next ? ", seguito «" + r.next + "»" : ""}` : "  = nessuna serie");
    } catch (e) { log("  = errore " + (e && e.code || e)); }
  }
  go.onclick = async () => {
    go.disabled = true; out.textContent = `Diagnosi del ${new Date().toLocaleString("it-IT")} · ${navigator.userAgent.slice(0, 80)}\n`;
    for (const b of BOOKS) await test(b);
    log("\nFine."); go.disabled = false;
  };
  document.getElementById("one").onclick = async () => {
    const b = { title: document.getElementById("t").value.trim(), author: document.getElementById("a").value.trim(), isbn: document.getElementById("i").value.replace(/[^\dXx]/g, "") || undefined };
    if (S && b.title) await test(b);
  };
  // Tre modi di chiedere a Wikidata le opere in serie di un autore: tempi e righe.
  const LANGS = '"it","en","mul","fr","de","es","pt","nl","sv","da","nb","fi","pl","cs"';
  const sparql = async q => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 30000), t0 = Date.now();
    try {
      const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q), { headers: { Accept: "application/sparql-results+json" }, signal: c.signal });
      const ms = Date.now() - t0; if (!r.ok) return { ms, err: "HTTP " + r.status };
      const j = await r.json(); return { ms, rows: j.results.bindings };
    } catch (e) { return { ms: Date.now() - t0, err: e.name }; } finally { clearTimeout(t); }
  };
  const ser = `?work p:P179 ?st. ?st a wikibase:BestRank; ps:P179 ?ser.
OPTIONAL { ?st pq:P1545 ?n1 } OPTIONAL { ?work wdt:P1545 ?n2 } BIND(COALESCE(?n1, ?n2) AS ?no)
OPTIONAL { ?st pq:P156 ?x1 } OPTIONAL { ?work wdt:P156 ?x2 } BIND(COALESCE(?x1, ?x2) AS ?nx)
OPTIONAL { ?nx rdfs:label ?ni FILTER(LANG(?ni) = "it") }
OPTIONAL { ?ser rdfs:label ?si FILTER(LANG(?si) = "it") } OPTIONAL { ?ser rdfs:label ?se FILTER(LANG(?se) = "en") } OPTIONAL { ?ser rdfs:label ?sm FILTER(LANG(?sm) = "mul") } BIND(COALESCE(?si, ?se, ?sm) AS ?sl)`;
  const qA = q => `SELECT ?work ?st (GROUP_CONCAT(DISTINCT ?nm; separator="|") AS ?names) (SAMPLE(?sl) AS ?s) (SAMPLE(?no) AS ?n) (SAMPLE(?ni) AS ?it) WHERE {
VALUES ?a { wd:${q} } ?work wdt:P50 ?a. FILTER NOT EXISTS { ?work wdt:P629 [] } ${ser}
OPTIONAL { ?work rdfs:label|skos:altLabel ?nm FILTER(LANG(?nm) IN (${LANGS})) }
} GROUP BY ?work ?st LIMIT 500`;
  const qB = q => `SELECT ?work ?st (GROUP_CONCAT(DISTINCT ?nm; separator="|") AS ?names) (SAMPLE(?sl) AS ?s) (SAMPLE(?no) AS ?n) (SAMPLE(?ni) AS ?it) WHERE {
{ SELECT DISTINCT ?work WHERE { VALUES ?a { wd:${q} } ?work wdt:P50 ?a; wdt:P179 ?any. FILTER NOT EXISTS { ?work wdt:P629 ?e0 } } }
${ser}
OPTIONAL { { ?work rdfs:label ?nm } UNION { ?work skos:altLabel ?nm } FILTER(LANG(?nm) IN (${LANGS})) }
} GROUP BY ?work ?st LIMIT 500`;
  const qC1 = q => `SELECT ?work ?st ?ser ?no ?nx WHERE { hint:Query hint:optimizer "None".
VALUES ?a { wd:${q} } ?work wdt:P50 ?a. ?work p:P179 ?st. ?st ps:P179 ?ser.
OPTIONAL { ?st pq:P1545 ?no } OPTIONAL { ?st pq:P156 ?nx } FILTER NOT EXISTS { ?work wdt:P629 ?e0 } } LIMIT 500`;
  const qC2 = ids => `SELECT ?x ?nm WHERE { VALUES ?x { ${ids.join(" ")} } { ?x rdfs:label ?nm } UNION { ?x skos:altLabel ?nm } FILTER(LANG(?nm) IN (${LANGS})) }`;
  const short = rows => rows.slice(0, 2).map(r => Object.values(r).map(v => String(v.value).replace("http://www.wikidata.org/entity/", "").slice(0, 40)).join(" / ")).join(" | ");
  document.getElementById("var").onclick = async () => {
    out.textContent = `Confronto del ${new Date().toLocaleString("it-IT")}\n`;
    for (const [nome, q] of [["Mick Herron", "Q24929761"], ["J. K. Rowling", "Q34660"], ["George R. R. Martin", "Q181677"], ["Stieg Larsson", "Q186317"]]) {
      log(`\n▶ ${nome}`);
      for (const [k, f] of [["A (attuale)", qA], ["B (prima le opere)", qB]]) {
        const r = await sparql(f(q)); log(`   · ${k}: ${r.err ? "ERRORE " + r.err : r.rows.length + " righe"} in ${r.ms} ms${r.rows ? " — " + short(r.rows) : ""}`);
      }
      const c1 = await sparql(qC1(q));
      if (c1.err) { log(`   · C1 (solo serie): ERRORE ${c1.err} in ${c1.ms} ms`); continue; }
      const ids = [...new Set(c1.rows.flatMap(r => ["work", "ser", "nx"].map(k => r[k] && r[k].value)).filter(Boolean))].map(u => "wd:" + u.split("/").pop());
      log(`   · C1 (solo serie): ${c1.rows.length} righe in ${c1.ms} ms — ${short(c1.rows)}`);
      if (ids.length) { const c2 = await sparql(qC2(ids)); log(`   · C2 (titoli): ${c2.err ? "ERRORE " + c2.err : c2.rows.length + " righe"} in ${c2.ms} ms`); }
    }
    const t0 = Date.now();
    try {
      const r = await fetch("https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&language=it&uselang=it&type=item&limit=7&origin=*&search=" + encodeURIComponent("Andrea Camilleri"));
      log(`\n▶ Cerca «Andrea Camilleri»: ${r.status} in ${Date.now() - t0} ms — ${(await r.text()).slice(0, 400)}`);
    } catch (e) { log(`\n▶ Cerca «Andrea Camilleri»: ERRORE ${e.name}`); }
    log("\nFine.");
  };
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(out.textContent); document.getElementById("copy").textContent = "Copiato"; }
    catch { const r = document.createRange(); r.selectNodeContents(out); getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
})();
</script>
</body>
</html>
