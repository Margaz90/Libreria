<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icona MyLibrary (v81)</title>
<style>
  body { margin: 0; padding: 24px; background: #F7F2EA; color: #1F2A2B; font: 15px/1.5 -apple-system, system-ui, sans-serif; display: grid; gap: 16px; justify-items: start; }
  .big { width: 300px; height: 300px; border-radius: 22.4%; }
  .row { display: flex; gap: 16px; align-items: center; }
  .row svg { border-radius: 22.4%; }
</style>
</head>
<body>
<!-- Icona A2 «La M dei dorsi» (v81), scelta da Diego tra le proposte del 3 novembre 2026: cinque dorsi crema le cui cime
     disegnano una M, segnalibro corallo che scende nella valle centrale (come nel titolo My▮Library). Colori dell'app.
     L'icona di prima (v41) è in icona-v41.html. Aprendo questa pagina con #render-512 o #render-512-m (margine per Android)
     compare solo l'icona: da lì si fanno i PNG con Playwright. -->
<h1 id="t">Icona MyLibrary</h1>
<div id="out"></div>
<script>
const P = "#24403F", CR = "#F4EAD8", CR2 = "#DCCBAE", CO = "#F06A5C";
const W = 118, GAP = 16, TOPS = [250, 390, 560, 390, 250], BASE = 812, X0 = (1024 - (W * 5 + GAP * 4)) / 2;
const RIB = { w: 74, end: 524, notch: 46 }; // segnalibro (v81: più largo, prima 58)
function icon(size, maskable = false) {
  let books = "";
  TOPS.forEach((t, i) => {
    const x = X0 + i * (W + GAP), fill = i % 2 ? CR2 : CR;
    books += `<rect x="${x}" y="${t}" width="${W}" height="${BASE - t + 12}" rx="12" fill="${fill}"/>` +
      `<rect x="${x}" y="${t + 44}" width="${W}" height="12" fill="${P}" opacity=".75"/><rect x="${x}" y="${t + 66}" width="${W}" height="5" fill="${P}" opacity=".75"/>`;
  });
  const cx = 512, rx = cx - RIB.w / 2;
  const rib = `<path d="M${rx} 0H${rx + RIB.w}V${RIB.end}L${cx} ${RIB.end - RIB.notch}L${rx} ${RIB.end}Z" fill="${CO}"/>`;
  const shelf = `<rect x="${X0 - 30}" y="${BASE}" width="${W * 5 + GAP * 4 + 60}" height="22" rx="11" fill="${CR2}"/>`;
  // Android ritaglia le icone «maskable» in un cerchio: tutto il disegno dentro l'80% centrale.
  const art = maskable ? `<g transform="translate(512 512) scale(.78) translate(-512 -512)">${books}${shelf}<path d="M${rx} -160H${rx + RIB.w}V${RIB.end}L${cx} ${RIB.end - RIB.notch}L${rx} ${RIB.end}Z" fill="${CO}"/></g>` : books + shelf + rib;
  return `<svg viewBox="0 0 1024 1024" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icona MyLibrary"><rect width="1024" height="1024" fill="${P}"/>${art}</svg>`;
}
const R = /^#render-(\d+)(-m)?$/.exec(location.hash);
if (R) { document.body.innerHTML = icon(Number(R[1]), !!R[2]); document.body.style.cssText = "margin:0;padding:0;background:transparent;display:block"; }
else document.getElementById("out").innerHTML = icon(300).replace("<svg ", '<svg class="big" ') + `<div class="row">${icon(120)}${icon(60)}${icon(40)}${icon(120, true)}</div>`;
</script>
</body>
</html>
